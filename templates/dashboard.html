
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>NEXUS V4.9</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <h1>NEXUS V4.9</h1>
    <div class="cards">
      <div class="card"><h3>Receita total</h3><div id="receita">-</div></div>
      <div class="card"><h3>Gastos do mês</h3><div id="gastos">-</div></div>
      <div class="card"><h3>Saldo</h3><div id="saldo">-</div></div>
    </div>

    <div class="panel">
      <h2>Cartões</h2>
      <table id="tbl-cartoes">
        <thead><tr><th>Cartão</th><th>Vencimento</th><th>Melhor dia</th><th>Melhor dia útil aplicado</th></tr></thead>
        <tbody></tbody>
      </table>
      <small>Se o melhor dia cair em sábado ou domingo, a regra usa a sexta anterior.</small>
    </div>

    <div class="panel">
      <h2>Lançar compra</h2>
      <div class="row">
        <input id="descricao" placeholder="Descrição, ex.: lanche">
        <input id="valor" type="number" step="0.01" placeholder="Valor">
        <select id="forma">
          <option value="dinheiro">Dinheiro</option>
          <option value="cartao">Cartão</option>
        </select>
        <select id="cartao"><option value="">Selecione o cartão</option></select>
        <button onclick="lancar()">Lançar</button>
      </div>
    </div>

    <div class="panel">
      <h2>Criar parcelado</h2>
      <div class="row parcelado">
        <input id="p_desc" placeholder="Descrição, ex.: tv samsung">
        <input id="p_valor" type="number" step="0.01" placeholder="Valor da parcela">
        <input id="p_total" type="number" step="1" placeholder="Total de parcelas">
        <select id="p_cartao"><option value="">Selecione o cartão</option></select>
        <button onclick="parcelar()">Criar</button>
      </div>
    </div>

    <div class="panel">
      <h2>Análise</h2>
      <pre id="analise"></pre>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
